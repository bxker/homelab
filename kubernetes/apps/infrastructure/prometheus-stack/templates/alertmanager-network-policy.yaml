# Alertmanager's API (9093) has no login: any pod that reaches it can post
# alerts (sent on to Signal) or add silences. Only Prometheus (alerts, and
# scrapes of 9093 and the config-reloader's 8080) and Grafana (datasource) get
# in. Selects the Alertmanager pods only; other monitoring pods stay open.
# kube-router accepts traffic from the pod's own node before evaluating
# policies, so kubelet probes, hostNetwork pods and kubectl port-forward still work.
# Pod labels below are the ones prometheus-operator sets on every pod of the
# Prometheus / Alertmanager CR, and the Grafana chart's selector labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      alertmanager: prometheus-stack-kube-prom-alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              prometheus: prometheus-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 9093   # http-web: alerts, /metrics
        - protocol: TCP
          port: 8080   # reloader-web: config-reloader /metrics
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: prometheus-stack
      ports:
        - protocol: TCP
          port: 9093
    # Cluster mesh between Alertmanager replicas (one today).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
              alertmanager: prometheus-stack-kube-prom-alertmanager
      ports:
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
