# Alertmanager webhook -> signal-cli-rest-api /v2/send. Stdlib-only script from
# files/signal_adapter.py on the official python image; nothing is built.
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-adapter
  namespace: {{ .Release.Namespace }}
data:
  signal_adapter.py: |
{{ .Files.Get "files/signal_adapter.py" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: signal-adapter
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: signal-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-adapter
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signal-adapter
  template:
    metadata:
      labels:
        app: signal-adapter
      annotations:
        # Restart the pod when the script changes.
        checksum/script: {{ .Files.Get "files/signal_adapter.py" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          image: python:3.14.8-slim-trixie
          command: ["python3", "-I", "/app/signal_adapter.py"]
          envFrom:
            - secretRef:
                name: signal   # NUMBER, RECIPIENT (templates/external-secret.yaml)
          env:
            - name: SIGNAL_API_URL
              value: http://signal-cli.{{ .Release.Namespace }}.svc:8080
            - name: LISTEN_PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
          resources:
            {{- toYaml .Values.adapter.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: script
          configMap:
            name: signal-adapter
