traefik:
  deployment:
    replicas: 1

  service:
    type: LoadBalancer
    annotations:
      # Fixed IP from MetalLB's homelab-static pool. AdGuard rewrites
      # *.homelab.local to this IP: keep traefikIP in
      # adguard-home/values.yaml equal to it.
      metallb.io/loadBalancerIPs: 192.168.1.200
      tailscale.com/expose: "true"
      tailscale.com/hostname: "homelab-traefik"

  ports:
    web:
      redirectTo:
        port: websecure
    websecure:
      tls:
        enabled: true

  logs:
    general:
      level: INFO
    access:
      enabled: true

  ingressRoute:
    dashboard:
      enabled: true
      matchRule: Host(`traefik.homelab.local`)
      # Internal entrypoint only (reach it with kubectl port-forward);
      # login from the ingress-auth app as well.
      middlewares:
        - name: basic-auth
