apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  annotations:
    # Fixed so the router's DHCP can hand it out as the LAN DNS server
    metallb.io/loadBalancerIPs: 192.168.1.201
    tailscale.com/expose: "true"
    tailscale.com/hostname: "homelab-dns"
spec:
  type: LoadBalancer
  selector:
    app: adguard-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-http
spec:
  # Reached through Traefik at adguard.homelab.local (templates/ingress.yaml),
  # which requires the ingress-auth login. AdGuard itself has no users.
  type: ClusterIP
  selector:
    app: adguard-home
  ports:
    - name: http
      port: 80
      targetPort: 3000
