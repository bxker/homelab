# healthchecks.io ping URL for the Watchdog dead-man's switch, from OpenBao
# secret/healthchecks (url). Alertmanager mounts it as an optional volume
# at /etc/alertmanager/secrets/alertmanager-healthchecks/url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: healthchecks
        property: url
