# NUMBER (linked Signal account) and RECIPIENT (group id or +number) for the
# adapter, from OpenBao secret/signal. Until it exists the ExternalSecret is not
# Ready and the adapter pod waits (CreateContainerConfigError).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signal
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: signal
    creationPolicy: Owner
  data:
    - secretKey: NUMBER
      remoteRef:
        key: signal
        property: number
    - secretKey: RECIPIENT
      remoteRef:
        key: signal
        property: recipient
