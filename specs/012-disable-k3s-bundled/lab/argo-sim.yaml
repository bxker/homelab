apiVersion: v1
kind: Namespace
metadata: { name: longhorn-system }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: basic-auth, namespace: longhorn-system }
spec: { basicAuth: { secret: basic-auth } }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: { name: sim-route, namespace: longhorn-system }
spec:
  routes:
    - match: Host(`longhorn.homelab.local`)
      kind: Rule
      middlewares: [{ name: basic-auth }]
      services: [{ name: kubernetes, namespace: default, port: 443 }]
---
apiVersion: v1
kind: Service
metadata: { name: sim-lb, namespace: default }
spec:
  type: LoadBalancer
  selector: { app: none }
  ports: [{ port: 8099, targetPort: 8099 }]
