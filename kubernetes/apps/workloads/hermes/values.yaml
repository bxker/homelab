# No upstream chart: plain manifests in templates/. Images are written literally
# in templates/ (not here) so Renovate's kubernetes manager can track them.
# Secrets: OpenBao secret/hermes (signal_account, allowed_users) -> Secret
# `hermes-signal` (templates/external-secret.yaml). Never put them here.
# Setup (link Signal, ChatGPT login, model): docs/GETTING-STARTED.md "Hermes Agent".

hermes:
  # HERMES_HOME: config.yaml, auth.json (ChatGPT login), sessions, memories, skills.
  storageClassName: longhorn
  size: 5Gi
  # Docs: 1 GB minimum, 2-4 GB recommended. Idle gateway ~220Mi in testing.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

signalCli:
  # Linked-device keys for the Signal account. Losing this volume means relinking.
  storageClassName: longhorn
  size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi
