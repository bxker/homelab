# Ignore terminatingReplicas in workload status: added in k8s 1.32, not in
# ArgoCD 2.13's schema, causes a ComparisonError on every app with workloads.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.customizations.ignoreDifferences.apps_Deployment: |
    jsonPointers:
    - /status/terminatingReplicas
  resource.customizations.ignoreDifferences.apps_StatefulSet: |
    jsonPointers:
    - /status/terminatingReplicas
  resource.customizations.ignoreDifferences.apps_DaemonSet: |
    jsonPointers:
    - /status/terminatingReplicas
  # ArgoCD >= 1.8 dropped Application health, so app-of-apps sync waves don't
  # wait for earlier children to be Healthy. Report each child's own health.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil and obj.status.health.status ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then hs.message = obj.status.health.message end
    end
    return hs
