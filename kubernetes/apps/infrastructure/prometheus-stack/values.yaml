kube-prometheus-stack:
  grafana:
    # Admin login comes from OpenBao via templates/grafana-admin-secret.yaml
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts: ["grafana.homelab.local"]
      tls:
        - secretName: grafana-tls
          hosts: ["grafana.homelab.local"]
      annotations:
        cert-manager.io/cluster-issuer: homelab-ca
    persistence:
      enabled: true
      size: 5Gi

  prometheus:
    prometheusSpec:
      retention: 15d
      scrapeInterval: 30s
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  # Alerts go to Signal through the adapter in the alerting app; Watchdog pings
  # healthchecks.io as a dead-man's switch. Lists (routes, receivers) replace
  # the chart's; its inhibit_rules and templates are kept by the map merge.
  alertmanager:
    enabled: true
    config:
      route:
        receiver: signal
        group_by: [alertname, namespace]
        repeat_interval: 12h
        routes:
          - receiver: healthchecks
            matchers: ['alertname = "Watchdog"']
            group_wait: 0s
            group_interval: 1m
            # Re-sends land on group_interval ticks, so the real ping is ~every
            # 2m: well inside the healthchecks.io check (5m period, 10m grace).
            repeat_interval: 1m
          - receiver: "null"
            matchers: ['alertname = "InfoInhibitor"']
      receivers:
        - name: signal
          webhook_configs:
            - url: http://signal-adapter.alerting.svc:8080/alert
              send_resolved: true
        - name: healthchecks
          webhook_configs:
            # Ping URL from OpenBao secret/healthchecks, via
            # templates/healthchecks-secret.yaml and the optional volume below.
            - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/url
              send_resolved: false
        - name: "null"
    alertmanagerSpec:
      # Optional secret volume, not alertmanagerSpec.secrets (a required
      # mount): if secret/healthchecks is missing the pod still starts and
      # Signal alerts still flow; only the Watchdog ping fails. The operator
      # mounts spec.secrets under /etc/alertmanager/secrets/<name>; none are
      # listed, so this path is free.
      volumes:
        - name: alertmanager-healthchecks
          secret:
            secretName: alertmanager-healthchecks
            optional: true
      volumeMounts:
        - name: alertmanager-healthchecks
          mountPath: /etc/alertmanager/secrets/alertmanager-healthchecks
          readOnly: true
      # Routing lives only in this file. The chart turns a null selector into
      # {} (= select every AlertmanagerConfig), so match a label nobody sets.
      alertmanagerConfigSelector:
        matchLabels:
          homelab.local/alertmanager-config: none
      alertmanagerConfigNamespaceSelector:
        matchLabels:
          homelab.local/alertmanager-config: none
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      # No storage: silences and notification state live in an emptyDir and
      # are lost on restart, which at worst re-sends an open alert once.

  nodeExporter:
    enabled: true

  # k3s runs the control plane inside the k3s process on the control-plane VM,
  # not as pods, so these point at its IP. The server config in
  # ansible/playbooks/tasks/k3s-disable-bundled.yml makes them listen beyond
  # localhost. Ports and TLS are explicit rather than left to the chart's guess.
  kubeControllerManager:
    endpoints: [192.168.1.100]
    service:
      port: 10257
      targetPort: 10257
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeScheduler:
    endpoints: [192.168.1.100]
    service:
      port: 10259
      targetPort: 10259
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeEtcd:
    endpoints: [192.168.1.100]
    service:
      port: 2381
      targetPort: 2381
  # kube-proxy runs on every node; scraping it would need its metrics address
  # opened on each worker too. Off, which also drops its alert rules.
  kubeProxy:
    enabled: false
