all:
  vars:
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    # k3s release every node installs (server and agents). The playbook doesn't
    # upgrade nodes that already run k3s: it stops if they run another version,
    # so bump this only together with an upgrade of the existing nodes.
    k3s_version: v1.36.5+k3s1
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: 192.168.1.155 # ← Your Proxmox IP
          ansible_port: 22

    k3s_cp:
      hosts:
        k3s-cp-1:
          ansible_host: 192.168.1.100
          ansible_user: ubuntu

    k3s_workers:
      hosts:
        k3s-worker-1:
          ansible_host: 192.168.1.101
          ansible_user: ubuntu
        k3s-worker-2:
          ansible_host: 192.168.1.102
          ansible_user: ubuntu
