# SIGNAL_ACCOUNT (the linked Signal number) and SIGNAL_ALLOWED_USERS (who may
# talk to the agent), from OpenBao secret/hermes. Until it exists the
# ExternalSecret is not Ready and the pod waits (CreateContainerConfigError).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-signal
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: hermes-signal
    creationPolicy: Owner
  data:
    - secretKey: SIGNAL_ACCOUNT
      remoteRef:
        key: hermes
        property: signal_account
    - secretKey: SIGNAL_ALLOWED_USERS
      remoteRef:
        key: hermes
        property: allowed_users
