# Tailscale Kubernetes Operator
#
# Prerequisites:
#   1. Create an OAuth client in Tailscale admin console:
#      https://login.tailscale.com/admin/settings/oauth
#      - Scopes: Devices (write)
#   2. Store it in OpenBao:
#      bao kv put secret/tailscale client_id=<YOUR_CLIENT_ID> client_secret=<YOUR_CLIENT_SECRET>
#      External Secrets then creates Secret `operator-oauth` in this namespace
#      (templates/external-secret.yaml), which the operator reads.
#
# Once deployed, expose any K8s service to your tailnet by annotating it:
#   kubectl annotate svc my-service tailscale.com/expose=true
#
# Or make a service a Tailscale LoadBalancer:
#   spec:
#     type: LoadBalancer
#     loadBalancerClass: tailscale

tailscale-operator:
  operatorConfig:
    hostname: "homelab-k8s-operator"
    logging: "info"
    defaultTags: "tag:k8s-operator"

  # Empty on purpose: the operator reads Secret `operator-oauth`, which
  # External Secrets creates from OpenBao (see prerequisites above)
  oauth:
    clientId: ""
    clientSecret: ""

  # Enable API server proxy — lets you kubectl over Tailscale
  apiServerProxyConfig:
    mode: "true"
