---
- name: Check installed k3s matches k3s_version
  hosts: k3s_cp:k3s_workers
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Look for an existing k3s binary
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Read installed k3s version
      ansible.builtin.command: /usr/local/bin/k3s --version
      register: k3s_installed
      changed_when: false
      when: k3s_binary.stat.exists

    - name: Stop if a node runs a different version than k3s_version
      ansible.builtin.assert:
        that: k3s_version in k3s_installed.stdout.split()
        fail_msg: >-
          {{ inventory_hostname }} runs "{{ k3s_installed.stdout_lines[0] }}" but
          k3s_version is {{ k3s_version }}. Set k3s_version in ansible/inventory.yml to
          the installed version, or upgrade the nodes first. Nothing was changed.
        quiet: true
      when: k3s_binary.stat.exists

# Longhorn's DaemonSets run on every node, including the (untainted) control
# plane, so every node needs its prerequisites.
- name: Install Longhorn prerequisites
  hosts: k3s_cp:k3s_workers
  become: true

  tasks:
    - name: Install iSCSI and NFS clients, and the Proxmox guest agent
      ansible.builtin.apt:
        name: [open-iscsi, nfs-common, qemu-guest-agent]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # The agent channel only exists after the VM is fully stopped and started
    # once with agent=enabled (see docs/GETTING-STARTED.md "Backups"), so only
    # start the service where the channel is present.
    - name: Look for the virtio guest agent channel
      ansible.builtin.stat:
        path: /dev/virtio-ports/org.qemu.guest_agent.0
      register: guest_agent_channel

    - name: Start the guest agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
      when: guest_agent_channel.stat.exists

    - name: Load iscsi_tcp at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/iscsi_tcp.conf
        content: "iscsi_tcp\n"
        owner: root
        group: root
        mode: "0644"

    - name: Check whether iscsi_tcp is loaded
      ansible.builtin.stat:
        path: /sys/module/iscsi_tcp
      register: iscsi_tcp_module

    - name: Load iscsi_tcp now
      ansible.builtin.command: modprobe iscsi_tcp
      changed_when: true
      when: not iscsi_tcp_module.stat.exists

    - name: Enable iscsid
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    - name: Gather installed packages
      ansible.builtin.package_facts:

    # Ubuntu's multipathd can claim the iSCSI disks Longhorn attaches and break
    # mounts (Longhorn KB "troubleshooting volume with multipath").
    - name: Create multipath drop-in directory
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: "'multipath-tools' in ansible_facts.packages"

    - name: Keep multipathd off Longhorn's disks
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/longhorn.conf
        content: |
          # Managed by Ansible (ansible/playbooks/k3s.yml). Longhorn attaches volumes
          # as /dev/sd* iSCSI disks; these VMs have single-path disks only.
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
        owner: root
        group: root
        mode: "0644"
      when: "'multipath-tools' in ansible_facts.packages"
      notify: Restart multipathd

  handlers:
    - name: Restart multipathd
      ansible.builtin.systemd:
        name: multipathd
        state: restarted

- name: Install k3s control plane
  hosts: k3s_cp
  become: true
  vars:
    k3s_bin: /usr/local/bin/k3s
    k3s_servicelb_finalizer: service.kubernetes.io/load-balancer-cleanup
    k3s_ingressclass_wait_retries: 30

  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Disable systemd-resolved (conflicts with k3s)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false

    - name: Write /etc/resolv.conf directly
      ansible.builtin.copy:
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8
        dest: /etc/resolv.conf
        mode: "0644"

    - name: Disable bundled Traefik and ServiceLB
      ansible.builtin.include_tasks: tasks/k3s-disable-bundled.yml

    - name: Download k3s install script for k3s_version
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
        dest: "/usr/local/share/k3s-install-{{ k3s_version }}.sh"
        mode: "0755"

    - name: Install k3s server
      ansible.builtin.command:
        argv:
          - "/usr/local/share/k3s-install-{{ k3s_version }}.sh"
          - server
          - --cluster-init
          - --node-ip
          - "{{ ansible_host }}"
          - --tls-san
          - "{{ ansible_host }}"
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"

    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 120

    - name: Read node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token
      no_log: true

    - name: Set token fact
      ansible.builtin.set_fact:
        k3s_token: "{{ k3s_node_token.content | b64decode | trim }}"
      no_log: true

    - name: Fetch kubeconfig
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /tmp/k3s-kubeconfig.yaml
        flat: true

- name: Fix kubeconfig server address
  hosts: localhost
  connection: local

  tasks:
    - name: Replace localhost with CP IP in kubeconfig
      ansible.builtin.replace:
        path: /tmp/k3s-kubeconfig.yaml
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ hostvars[groups['k3s_cp'][0]]['ansible_host'] }}:6443"

    - name: Ensure ~/.kube exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        mode: "0700"

    - name: Install kubeconfig
      ansible.builtin.copy:
        src: /tmp/k3s-kubeconfig.yaml
        dest: "{{ ansible_env.HOME }}/.kube/config"
        mode: "0600"

- name: Install k3s workers
  hosts: k3s_workers
  become: true

  vars:
    k3s_cp_host: "{{ hostvars[groups['k3s_cp'][0]]['ansible_host'] }}"
    k3s_token: "{{ hostvars[groups['k3s_cp'][0]]['k3s_token'] }}"

  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Disable systemd-resolved (conflicts with k3s)
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false

    - name: Write /etc/resolv.conf directly
      ansible.builtin.copy:
        content: |
          nameserver 1.1.1.1
          nameserver 8.8.8.8
        dest: /etc/resolv.conf
        mode: "0644"

    - name: Create k3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The agent reads server and token from here, so the token never appears
    # on a command line or in a process environment.
    - name: Write k3s agent config (server and join token)
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        content: "{{ {'server': 'https://' ~ k3s_cp_host ~ ':6443', 'token': k3s_token} | to_nice_yaml }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Download k3s install script for k3s_version
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
        dest: "/usr/local/share/k3s-install-{{ k3s_version }}.sh"
        mode: "0755"

    - name: Install k3s agent
      ansible.builtin.command:
        argv: ["/usr/local/share/k3s-install-{{ k3s_version }}.sh", agent]
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
