# Grafana admin login, from OpenBao secret/grafana (admin_user, admin_password).
# Grafana only uses it to seed a new database; to rotate, see
# docs/GETTING-STARTED.md "Rotate the Grafana admin password".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana
        property: admin_user
    - secretKey: admin-password
      remoteRef:
        key: grafana
        property: admin_password
