apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      affinity:
        # ~500 MiB that the 4 GB control plane can't spare: an API restart
        # there ran it out of memory. Prefer workers; still runs on the
        # control plane if no worker is schedulable.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
