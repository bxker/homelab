[defaults]

[ssh_connection]
# Trust each host's key on first connect, then refuse a changed one. Keys live in
# ansible/known_hosts (gitignored; the mise tasks run Ansible from ansible/).
# `mise run infra-destroy` clears them, since recreated VMs get new keys.
# The first three options are Ansible's defaults, kept because ssh_args replaces them.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=accept-new
