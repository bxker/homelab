apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  annotations:
    # Fixed so the router's DHCP can hand it out as the LAN DNS server
    metallb.io/loadBalancerIPs: 192.168.1.201
    tailscale.com/expose: "true"
    tailscale.com/hostname: "homelab-dns"
spec:
  type: LoadBalancer
  selector:
    app: adguard-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-http
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.203
spec:
  type: LoadBalancer
  selector:
    app: adguard-home
  ports:
    - name: http
      port: 80
      targetPort: 3000
